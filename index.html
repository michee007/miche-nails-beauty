<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Miche Nails & Beauty - Calculadora</title>
    <meta name="description" content="Calculadora interactiva de precios para Miche Nails & Beauty. Cotiza múltiples servicios en tiempo real.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    
    <!-- PWA & Mobile Optimization -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#c5a059">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="main-header">
            <div class="logo">
                <span class="logo-accent">Miche</span> Nails & Beauty
            </div>
            <h1>Cotizador Móvil</h1>
            <p class="subtitle">Calcula varios servicios en segundos</p>
        </header>

        <main class="content">
            <!-- Services List Container -->
            <div id="all-services-container">
                <!-- Service blocks will be injected here -->
            </div>

            <!-- Add Service Button -->
            <div class="add-service-section" style="margin: 20px 0; padding: 0 10px;">
                <button class="btn-add-service" onclick="addNewService()">
                    <i data-lucide="plus-circle"></i> + Agregar otro servicio
                </button>
            </div>
        </main>

        <!-- Sticky Footer -->
        <footer class="sticky-footer">
            <div class="total-bar">
                <div class="total-display">
                    <span class="total-label">TOTAL GENERAL:</span>
                    <span id="total-amount" class="total-value">$0</span>
                </div>
                <div class="actions">
                    <button class="btn btn-secondary" onclick="resetAll()">
                        <i data-lucide="rotate-ccw"></i>
                    </button>
                    <button class="btn btn-primary" onclick="showSummary()">
                        <i data-lucide="file-text"></i> Cotizar
                    </button>
                </div>
            </div>
        </footer>

        <!-- Summary Modal -->
        <div id="summary-modal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Mi Cotización</h2>
                    <button class="close-modal" onclick="closeSummary()">&times;</button>
                </div>
                <div id="summary-details" class="modal-body">
                    <!-- Summary content will be injected here -->
                </div>
                <div class="modal-footer vertical">
                    <button class="btn btn-primary w-full" onclick="copySummary()">
                        <i data-lucide="copy"></i> Copiar Resumen
                    </button>
                    <button class="btn btn-outline w-full" onclick="window.print()">
                        <i data-lucide="printer"></i> Imprimir / PDF
                    </button>
                    <button class="btn btn-secondary w-full" onclick="closeSummary()">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js?v=1.0.2"></script>
</body>
</html>
